<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f5efe0; color: #2f2a24; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #1f261c; color: #ede6d6; } }
      main { max-width: 28rem; text-align: center; }

  <body>
    <main>
      <h1>No connection right now.</h1>
      <p>Nothing was lost. When you're back online, <a href="/">open the door again</a>.</p>
    </main>

</html>
